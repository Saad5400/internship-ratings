; Loaded by Railpack as /usr/local/etc/php/conf.d/php.ini (replaces Railpack's
; default). Values mirror the old Nixpacks PHP (php -i in the live container),
; except where a comment says otherwise.
[PHP]
expose_php = Off
display_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED
variables_order = "EGPCS"

output_buffering = Off
implicit_flush = Off
zlib.output_compression = Off

; Per worker thread. Octane workers stay resident, so this also bounds a leak;
; config/octane.php 'garbage' forces a collection above 50MB.
memory_limit = 128M
; The app takes no file uploads; a Livewire form post is a few KB.
upload_max_filesize = 2M
post_max_size = 8M
max_file_uploads = 20
; Octane's FrankenPHP worker calls set_time_limit() with
; config('octane.max_execution_time') (30s, the same budget RoadRunner's
; exec_ttl enforced). Under FrankenPHP (ZTS) it is WALL-CLOCK time.
; CLI (queue, scheduler) is always unlimited.
max_execution_time = 30
max_input_time = 60

date.timezone = UTC

[opcache]
; RoadRunner workers were CLI processes and ran without opcache
; (opcache.enable_cli=0). FrankenPHP workers are threads of one process and
; share a single opcache, so compiled code is held once, not per worker.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
