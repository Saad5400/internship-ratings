; Process tree for the Railpack image, started by /start-container.sh.
; Octane on FrankenPHP serves HTTP; the rest mirror the old nixpacks
; supervisor programs. Everything runs as root, as the web server already did
; under Nixpacks: its queue and scheduler ran as www-data, so a laravel.log
; first written by root (Octane, or any `docker exec php artisan`) was
; unwritable for them and the queue worker crash-looped to FATAL.
[unix_http_server]
file=/tmp/supervisor.sock

[supervisord]
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
nodaemon=true
user=root
minfds=1024
minprocs=200

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

; octane:start stays in the foreground and supervises the frankenphp process
; it launches with /Caddyfile (thread pool sizing lives there). Two resident
; workers, each recycled after 500 requests as under RoadRunner. Changing
; --workers means changing num_threads in /Caddyfile too.
[program:octane]
command=php /app/artisan octane:start --server=frankenphp --host=0.0.0.0 --port=%(ENV_PORT)s --admin-port=2019 --caddyfile=/Caddyfile --workers=2 --max-requests=500
directory=/app
autostart=true
autorestart=true
startretries=10
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:scheduler]
command=/bin/bash /app/deploy/scheduler.sh
directory=/app
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/worker-scheduler.log
stderr_logfile=/var/log/worker-scheduler.log

[program:queue]
command=php /app/artisan queue:work --sleep=3 --tries=3 --max-time=3600
directory=/app
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=60
stdout_logfile=/var/log/worker-queue.log
stderr_logfile=/var/log/worker-queue.log
